                correctAnswer: 1,

                explanation: "Варианты благотворительных мероприятий — благотворительные акции, бесплатные концерты, балы, чтения, заключение договора пожертвования."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedOption = null;
        let isAnswered = false;

        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedback = document.getElementById('feedback');
        const explanation = document.getElementById('explanation');
        const toggleExplanationBtn = document.getElementById('toggle-explanation');
        const result = document.getElementById('result');
        const progressBar = document.getElementById('progress-bar');
        const questionCounter = document.getElementById('question-counter');

        function loadQuestion() {
            const current = questions[currentQuestion];
            questionText.textContent = current.question;
            optionsContainer.innerHTML = '';
            selectedOption = null;
            isAnswered = false;
            feedback.classList.add('hidden');
            explanation.classList.add('hidden');
            toggleExplanationBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            submitBtn.classList.remove('hidden');

            current.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.className = 'w-full p-4 text-left rounded-lg border-2 border-gray-200 text-gray-700 hover:bg-indigo-50 hover:border-indigo-300 transition-all duration-200';
                button.onclick = () => selectOption(index);
                optionsContainer.appendChild(button);
            });

            updateProgress();
        }

        function selectOption(index) {
            if (isAnswered) return;
            selectedOption = index;
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach((btn, i) => {
                btn.className = i === index
                    ? 'w-full p-4 text-left rounded-lg border-2 border-indigo-400 bg-indigo-100 text-indigo-800 transition-all duration-200'
                    : 'w-full p-4 text-left rounded-lg border-2 border-gray-200 text-gray-700 hover:bg-indigo-50 hover:border-indigo-300 transition-all duration-200';
            });
        }

        function checkAnswer() {
            if (selectedOption === null) return;
            isAnswered = true;
            const current = questions[currentQuestion];
            const isCorrect = selectedOption === current.correctAnswer;
            const buttons = optionsContainer.querySelectorAll('button');

            buttons.forEach((btn, index) => {
                if (index === current.correctAnswer) {
                    btn.className = 'w-full p-4 text-left rounded-lg border-2 border-green-400 bg-green-100 text-green-800 transition-all duration-200';
                } else if (index === selectedOption && !isCorrect) {
                    btn.className = 'w-full p-4 text-left rounded-lg border-2 border-red-400 bg-red-100 text-red-800 transition-all duration-200';
                } else {
                    btn.className = 'w-full p-4 text-left rounded-lg border-2 border-gray-200 text-gray-700 transition-all duration-200';
                    btn.disabled = true;
                }
            });

            if (isCorrect) {
                score++;
                feedback.innerHTML = '✅ Правильно!';
                feedback.className = 'mt-4 p-3 bg-green-100 text-green-800 rounded-lg text-center font-medium';
            } else {
                feedback.innerHTML = `❌ Неправильно. Правильный ответ: ${current.options[current.correctAnswer]}`;
                feedback.className = 'mt-4 p-3 bg-red-100 text-red-800 rounded-lg text-center font-medium';
            }
            feedback.classList.remove('hidden');
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            toggleExplanationBtn.classList.remove('hidden');

            if (currentQuestion === questions.length - 1) {
                nextBtn.textContent = 'Завершить тест';
            }
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            const percentage = Math.round((score / questions.length) * 100);
            result.innerHTML = `Ваш результат: ${score} из ${questions.length} (${percentage}%)`;
            result.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            questionCounter.classList.add('hidden');
            progressBar.style.width = '100%';
        }

        function toggleExplanation() {
            const current = questions[currentQuestion];
            if (explanation.classList.contains('hidden')) {
                explanation.innerHTML = `<strong>Пояснение:</strong> ${current.explanation}`;
                explanation.classList.remove('hidden');
                toggleExplanationBtn.textContent = 'Скрыть пояснение';
            } else {
                explanation.classList.add('hidden');
                toggleExplanationBtn.textContent = 'Показать пояснение';
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;
            questionCounter.textContent = `Вопрос ${currentQuestion + 1} из ${questions.length}`;
        }

        submitBtn.onclick = checkAnswer;
        nextBtn.onclick = nextQuestion;
        toggleExplanationBtn.onclick = toggleExplanation;

        loadQuestion();
    </script>
